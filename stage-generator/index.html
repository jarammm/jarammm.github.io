<!DOCTYPE html>
<!-- Stage Generator: an n-by-n pad controller that removes or adds song stems in real time
     and reports the result to a show bridge (see stage-generator/README.md). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stage Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>Stage Generator</h1>
        <p class="song" id="song-title">No stems loaded</p>
        <p class="credit" id="credit" hidden></p>
      </div>
      <div class="chips">
        <span class="chip" id="audio-status" data-state="idle">audio: idle</span>
        <span class="chip" id="bridge-status" data-state="off">bridge: off</span>
      </div>
    </header>

    <section class="controls" aria-label="Controls">
      <div class="group">
        <label id="song-picker" hidden>Song
          <select id="song-select"></select>
        </label>
      </div>

      <div class="group" role="radiogroup" aria-label="Method">
        <label class="seg"><input type="radio" name="mode" value="subtract" checked>
          <span>Subtract<small id="subtract-hint">from original</small></span></label>
        <label class="seg"><input type="radio" name="mode" value="add">
          <span>Add<small>from silence</small></span></label>
      </div>

      <div class="group" role="radiogroup" aria-label="Pool">
        <label class="seg"><input type="radio" name="pool" value="mix" checked>
          <span>Mix<small>all stems</small></span></label>
        <label class="seg"><input type="radio" name="pool" value="accompaniment">
          <span>Accompaniment<small>instruments</small></span></label>
        <label class="seg"><input type="radio" name="pool" value="vocals">
          <span>Vocals<small>voices</small></span></label>
      </div>

      <div class="group">
        <label>Quantize
          <select id="quantize">
            <option value="off">off</option>
            <option value="beat">beat</option>
            <option value="bar">bar</option>
          </select>
        </label>
        <button id="clear" type="button">Clear</button>
        <button id="export" type="button" disabled title="Download what is playing (current section) as WAV">Export mix</button>
        <button id="start" type="button" class="primary" disabled>Start</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
    </section>

    <section class="transport" aria-label="Playback position">
      <div class="times"><span id="time-cur">0:00.0</span><span id="time-dur">0:00.0</span></div>
      <input id="seek" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="Seek">
      <div id="section-bar" class="section-bar" aria-label="Sections"></div>
    </section>

    <section class="grid-wrap">
      <div id="grid" class="grid" aria-label="Stem pads"></div>
      <p class="drop-hint" id="drop-hint">Choose a song above.</p>
    </section>

    <section class="readout" aria-live="polite">
      <div class="row"><span class="k">playing</span><span id="audible-list">—</span></div>
      <div class="row"><span class="k">position</span><span id="position">—</span></div>
      <div class="row"><span class="k">export</span><span id="export-info">—</span></div>
      <div class="meter" id="meter" aria-hidden="true"></div>
      <ul class="warnings" id="warnings"></ul>
    </section>

    <details class="dev">
      <summary>Other sources (for development)</summary>
      <p>Load a synthesized demo, or your own stems (a folder with stems.json, or audio files) held in memory.</p>
      <div class="group">
        <button id="load-demo" type="button">Load demo</button>
        <label class="file-btn">
          Open stems folder…
          <input id="load-folder" type="file" webkitdirectory multiple hidden>
        </label>
        <label class="file-btn">
          Open files…
          <input id="load-files" type="file" accept="audio/*,.json" multiple hidden>
        </label>
      </div>
    </details>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
