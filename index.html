function fallbackCopyTextToClipboard(text) {
    // Create a temporary textarea element
    const textArea = document.createElement("textarea");
    textArea.value = text;

    // Avoid scrolling to bottom
    textArea.style.position = "fixed";
    textArea.style.top = 0;
    textArea.style.left = 0;
    textArea.style.width = '2em';
    textArea.style.height = '2em';
    textArea.style.padding = 0;
    textArea.style.border = 'none';
    textArea.style.outline = 'none';
    textArea.style.boxShadow = 'none';
    textArea.style.background = 'transparent';

    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        const successful = document.execCommand('copy');
        if (!successful) {
            throw new Error('Fallback: Copying text command was unsuccessful');
        }
        console.log('Fallback: Copying text command was successful');
    } catch (err) {
        console.error('Fallback: Unable to copy', err);
        // Prompt the user to manually copy
        alert("Your browser does not support automatic copying. Please copy the text manually:\n\n" + text);
    }

    document.body.removeChild(textArea);
}
async function copyBibtexFromFile(filePath, linkElement) {
    try {
        const response = await fetch(filePath);
        if (!response.ok) throw new Error("Failed to fetch BibTeX file");

        const bibtexContent = await response.text();

        // Attempt to use the Clipboard API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
                await navigator.clipboard.writeText(bibtexContent);
                console.log("Copied to clipboard using Clipboard API.");
            } catch (clipboardError) {
                console.warn("Clipboard API failed, falling back to execCommand method.", clipboardError);
                fallbackCopyTextToClipboard(bibtexContent);
            }
        } else {
            fallbackCopyTextToClipboard(bibtexContent);
        }

        // Show "Copied!" overlay by adding the .copied class temporarily
        linkElement.classList.add("copied");

        // Remove the "Copied!" overlay after 2 seconds
        setTimeout(() => {
            linkElement.classList.remove("copied");
        }, 2000);

    } catch (error) {
        console.error("An error occurred:", error);
        alert("There was an issue copying the BibTeX content. Your browser may not support copying to the clipboard.");
    }
}
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const controlBar = document.querySelector(".playback-bar");
    const playBtn = controlBar.querySelector("#play");
    const restartBtn = controlBar.querySelector("#restart");
    const downloadBtn = controlBar.querySelector("#download");
    const progressContainer = controlBar.querySelector(".progress-container");
    const progress = controlBar.querySelector(".progress");
    const elapsedTimeElement = controlBar.querySelector("#elapsed-time");
    const totalDurationElement = controlBar.querySelector("#total-duration");
    const currentProjectNameElement = document.getElementById("current-project-name");

    currentProjectNameElement.textContent = ""; // Ensure project name is empty initially

    let globalAudio = null;
    let currentPlayingProject = null;

    function updateProgressBar() {
        if (globalAudio && !isNaN(globalAudio.duration)) {
            const progressPercent = (globalAudio.currentTime / globalAudio.duration) * 100;
            progress.style.setProperty('--progress-width', `${progressPercent}%`);

            const minutes = Math.floor(globalAudio.currentTime / 60);
            const seconds = Math.floor(globalAudio.currentTime % 60).toString().padStart(2, "0");
            elapsedTimeElement.textContent = `${minutes}:${seconds}`;

            const durationMinutes = Math.floor(globalAudio.duration / 60);
            const durationSeconds = Math.floor(globalAudio.duration % 60).toString().padStart(2, "0");
            totalDurationElement.textContent = `${durationMinutes}:${durationSeconds}`;
        }
    }

    function resetPreviousProjectState() {
        if (currentPlayingProject) {
            currentPlayingProject.classList.remove("playing");
            currentPlayingProject.classList.remove("is-playing");
        }
    }

    function playAudioForProject(project) {
        const audioFile = project.getAttribute("data-audio");
        const projectImageElement = project.querySelector(".img-project");
        const projectName = project.querySelector(".project-header span").textContent;

        const projectImageSrc = projectImageElement.style.backgroundImage
            ? projectImageElement.style.backgroundImage.match(/url\(["']?(.*?)["']?\)/)[1]
            : "";

        const currentProjectImgElement = document.getElementById("current-project-img");

        if (globalAudio && globalAudio.src !== audioFile) {
            globalAudio.pause();
            resetPreviousProjectState();
            globalAudio = null;
        }

        if (!globalAudio) {
            globalAudio = new Audio(audioFile);
            globalAudio.addEventListener("timeupdate", updateProgressBar);
            globalAudio.addEventListener("ended", () => {
                resetPreviousProjectState();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                globalAudio = null;
                progress.style.setProperty('--progress-width', '0%');
                elapsedTimeElement.textContent = "0:00";
                totalDurationElement.textContent = "0:00";

                currentProjectImgElement.src = "";
                currentProjectImgElement.style.display = "none";
                currentProjectNameElement.textContent = "";
            });
            globalAudio.currentTime = 0; // Start from the beginning
        }

        globalAudio.play();
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        project.classList.add("playing");
        project.classList.add("is-playing");  // Audio is playing
        currentPlayingProject = project;

        currentProjectNameElement.textContent = projectName;
        if (projectImageSrc) {
            currentProjectImgElement.src = projectImageSrc;
            currentProjectImgElement.style.display = "block";
        } else {
            currentProjectImgElement.style.display = "none";
        }

        globalAudio.addEventListener("loadedmetadata", () => {
            const durationMinutes = Math.floor(globalAudio.duration / 60);
            const durationSeconds = Math.floor(globalAudio.duration % 60).toString().padStart(2, "0");
            totalDurationElement.textContent = `${durationMinutes}:${durationSeconds}`;
        });
    }

    document.querySelectorAll(".project-display").forEach((project) => {
        const playButton = project.querySelector(".play-btn");

        playButton.addEventListener("click", (event) => {
            event.stopPropagation();
            if (project === currentPlayingProject && !globalAudio.paused) {
                globalAudio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                // Do not remove the .playing class
                project.classList.remove("is-playing");
            } else if (project === currentPlayingProject && globalAudio.paused) {
                globalAudio.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                // No need to add the .playing class again
                project.classList.add("is-playing"); // Add .is-playing class
            } else {
                playAudioForProject(project);
            }
        });
    });

    playBtn.addEventListener("click", () => {
        if (globalAudio && !globalAudio.paused) {
            // Pause the audio
            globalAudio.pause();
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            if (currentPlayingProject) {
                currentPlayingProject.classList.remove("is-playing"); // Remove .is-playing class
            }
        } else if (globalAudio && globalAudio.paused) {
            // Resume playback
            globalAudio.play();
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            if (currentPlayingProject) {
                currentPlayingProject.classList.add("is-playing"); // Add .is-playing class
            }
        } else if (currentPlayingProject) {
            // Play the current project
            playAudioForProject(currentPlayingProject);
        } else {
            // Play the first project
            const firstProject = document.querySelector(".project-display");
            if (firstProject) {
                playAudioForProject(firstProject);
            }
        }
    });

    restartBtn.addEventListener("click", () => {
        if (globalAudio) {
            globalAudio.currentTime = 0; // Reset playback to the beginning
            globalAudio.play(); // Start playing
            playBtn.innerHTML = '<i class="fas fa-pause"></i>'; // Update the play button to show pause icon
            if (currentPlayingProject) {
                updatePlayButtonState(currentPlayingProject, true);
            }
        }
    });

    downloadBtn.addEventListener("click", () => {
        if (globalAudio) {
            const link = document.createElement('a');
            link.href = globalAudio.src;
            link.download = extractFileName(globalAudio.src);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    });

    function extractFileName(url) {
        return url.substring(url.lastIndexOf('/') + 1);
    }


    function updatePlayButtonState(project) {
        project.classList.add("playing");
    }

    // Event listener for clicking on the progress bar
    progressContainer.addEventListener('click', setProgress);

    function setProgress(e) {
        if (globalAudio && !isNaN(globalAudio.duration)) {
            const rect = progressContainer.getBoundingClientRect();
            const width = rect.width;
            const offsetX = e.clientX - rect.left;
            const duration = globalAudio.duration;

            const clickRatio = offsetX / width;
            // Ensure clickRatio is between 0 and 1
            const safeClickRatio = Math.min(Math.max(clickRatio, 0), 1);

            globalAudio.currentTime = safeClickRatio * duration;
        }
    }
});


window.addEventListener('pageshow', function(event) {
    if (globalAudio) {
        // Update play button based on audio state
        if (globalAudio.paused) {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            if (currentPlayingProject) {
                currentPlayingProject.classList.remove("is-playing");
            }
        } else {
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            if (currentPlayingProject) {
                currentPlayingProject.classList.add("is-playing");
            }
        }
    } else {
        // No audio is playing
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
    }
});
</script>
